name: flutter-checks
on:
  push:
    paths: ['mobile/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/flutter.yml']
jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap Android runner if missing
        working-directory: mobile
        run: flutter create --platforms android --project-name hatua_app .
      - name: Dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test
