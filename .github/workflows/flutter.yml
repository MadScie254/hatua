name: flutter-checks
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/flutter.yml']

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so CI matches the version the code was last verified with (docs/HANDOFF.md).
  FLUTTER_VERSION: '3.47.7'

jobs:
  analyze-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Disable Flutter/Dart telemetry
        run: flutter --disable-analytics
      - name: Android runner must be tracked (no silent regeneration)
        run: test -f android/app/src/main/AndroidManifest.xml
      - run: flutter pub get --enforce-lockfile
      - name: Generated localisations match the ARB files
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n
      - name: English and Kiswahili define the same strings
        run: |
          python3 - <<'EOF'
          import json, sys
          en = {k for k in json.load(open('lib/l10n/app_en.arb')) if not k.startswith('@')}
          sw = {k for k in json.load(open('lib/l10n/app_sw.arb')) if not k.startswith('@')}
          if en != sw:
              sys.exit(f'missing in sw: {sorted(en - sw)}; extra in sw: {sorted(sw - en)}')
          EOF
      - run: flutter analyze
      - run: flutter test

  build-debug-apk:
    needs: analyze-test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --disable-analytics
      - run: flutter pub get --enforce-lockfile
      - name: Build debug APK (compiles manifests, resources and Gradle config)
        run: flutter build apk --debug --target-platform android-arm64
      - name: Build release APK (debug-signed until a release key exists)
        run: flutter build apk --release --target-platform android-arm64 --dart-define=HATUA_API_URL=https://api.example.invalid
      - name: Merged release manifest is locked down
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2
          apk=build/app/outputs/flutter-apk/app-release.apk
          tree=$("$aapt2" dump xmltree --file AndroidManifest.xml "$apk")
          perms=$("$aapt2" dump permissions "$apk" | grep -o "name='[^']*'" | grep -v DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION | sort -u)
          echo "$perms"
          # Only INTERNET (plus androidx's internal signature permission filtered above).
          test "$perms" = "name='android.permission.INTERNET'"
          echo "$tree" | grep -q 'allowBackup(0x01010280)=false'
          echo "$tree" | grep -q 'dataExtractionRules'
          # The debug-only cleartext config must not leak into release.
          ! echo "$tree" | grep -q -e 'networkSecurityConfig' -e 'usesCleartextTraffic(0x010104ec)=true'
