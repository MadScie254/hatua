name: backend-tests
on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: ci-only-long-random-looking-but-not-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py check
      - run: python manage.py test
      - run: ruff check .
      - name: Production settings refuse to start without secrets
        env:
          DJANGO_DEBUG: '0'
          DJANGO_SECRET_KEY: ''
        run: |
          if python manage.py check 2>/dev/null; then
            echo "settings started without DJANGO_SECRET_KEY in production mode" >&2; exit 1
          fi
      - name: Deploy checklist (production-like env, warnings reviewed in docs/HANDOFF.md)
        env:
          DJANGO_DEBUG: '0'
          DJANGO_SECRET_KEY: ci-deploy-check-only-0123456789abcdefghijklmnopqrstuvwxyzABCDEFGH
          DJANGO_ALLOWED_HOSTS: api.example.invalid
          DATABASE_URL: sqlite:////tmp/deploy-check.sqlite3
        run: python manage.py check --deploy
