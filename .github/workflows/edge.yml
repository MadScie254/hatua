name: edge-worker
on:
  push:
    branches: [main]
    paths: ['edge/**', '.github/workflows/edge.yml']
  pull_request:
    paths: ['edge/**', '.github/workflows/edge.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Bundle check (no Cloudflare credentials needed)
        run: npx wrangler deploy --dry-run --outdir dist
